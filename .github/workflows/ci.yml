name: INTO THE ABYSS · CI review
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: abyss-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Vendor official PixiJS with license
        run: npm run vendor:pixi
      - name: TypeScript and tactical regression
        run: npm run check
      - name: Report release readiness (advisory; physical tests remain manual)
        run: npm run audit:release
      - name: Package only distributable assets
        run: npm run package:site && npm run verify:site
      - name: Install Playwright Chromium
        run: |
          python3 -m pip install --user playwright==1.55.0
          python3 -m playwright install --with-deps chromium
      - name: Browser test of real PixiJS on HTTP
        run: python3 qa-v070-browser.py && python3 qa-v075-browser.py && python3 qa-v080-browser.py && python3 qa-v081-browser.py && python3 qa-v082-browser.py && python3 qa-v083-browser.py && python3 qa-v084-browser.py && python3 qa-v085-browser.py && python3 qa-v090-browser.py && python3 qa-v091-browser.py && python3 qa-v092-browser.py && python3 qa-v093-browser.py && python3 qa-v094-browser.py && python3 qa-v095-browser.py
      - name: Audit five sectors and Chromium frame timing
        run: python3 qa-launch-audit.py
      - name: Upload launch audit measurements (headless CI, not physical hardware)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyss-launch-audit-v094
          path: audit-report.json
          retention-days: 30
      - name: Attach review site, not publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyss-v070-review
          path: _site/
          retention-days: 14
